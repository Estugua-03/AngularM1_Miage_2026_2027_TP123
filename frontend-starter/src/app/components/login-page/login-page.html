<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <fieldset [disabled]="submitting()">
      <label>Email<input type="email" formControlName="email" autocomplete="email" /></label>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="error" role="alert">Saisissez une adresse email valide.</p>
      }
      <label>Mot de passe<input type="password" formControlName="password" autocomplete="current-password" /></label>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="error" role="alert">Le mot de passe est requis.</p>
      }
      <button type="submit" [disabled]="submitting()">{{ submitting() ? 'En cours…' : 'Se connecter' }}</button>
    </fieldset>
  </form>
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
  <p><a routerLink="/register">Créer un compte</a></p>
</section>
